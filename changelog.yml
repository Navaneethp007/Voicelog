# voicelog configuration
# Values are validated when they load: a bad one names this file, the
# setting and the value, rather than failing somewhere downstream.
# All fields are optional — built-in defaults are used for anything not listed here.

# WHICH provider, model and key you use is a personal choice, so it lives in
# your own config instead of here - run `voicelog --setup` and it writes:
#
#   Windows:       %APPDATA%\voicelog\config.yml
#   macOS / Linux: ~/.config/voicelog/config.yml
#
# That way you configure once and every repo inherits it, and this file - which
# a project can commit - carries no keys and no model choice.
#
# Uncomment below only to force one provider/model on everyone working in this
# repo. Note there is deliberately no default model: provider model ids get
# retired, so `voicelog --setup` reads the live catalogue instead of trusting a
# value shipped months ago.
#
# Setting `provider:` alone is enough: base_url and api_key_env come from that
# provider's preset, exactly as `--provider <name>` has always done. Set one of
# them yourself and yours wins - the preset only fills what you leave out.
#
# provider: nvidia          # nvidia | openai | groq | openrouter | ollama | custom
# base_url: https://integrate.api.nvidia.com/v1   # only to override the preset
# model: <a live id from your provider>
# api_key_env: NVIDIA_API_KEY   # name of the env var only; never the key itself

llm_timeout: 120  # seconds to wait for the model before failing over to the raw commit list

# Sections that will appear in the generated changelog (in this order).
# Commits are grouped into these sections by the model.
sections:
  - Breaking
  - Features
  - Fixes
  - Internal

# Commit subject patterns to drop before sending to the model (regex, case-insensitive).
noise:
  - '^wip'
  - '^merge'
  - '^fmt'
  - '^chore\(deps\)'

# Directory containing 1-3 past changelogs (.md or .txt) used as style examples.
# Missing or empty directory → neutral default tone.
voice_samples: .changelog/voice/

# Number of commits to use when no prior tag exists in the repo.
fallback_commits: 50

# On very large ranges, only the most recent N commits are sent to the model
# (keeps generation fast and cheap). The full changelog still covers these.
max_commits: 50

# How many recent commits `--new` reads to orient you on a repo you just
# cloned (ignores tags entirely — "what's been happening lately").
onboard_commits: 15

# --- Speech: the log talks to you ---
# Which voice you like is personal too, so `voicelog --setup` writes it to your
# user config. Uncomment here only to force one voice for the whole project.
#
# As above, `tts_provider:` alone brings its own key var and voice; `none`
# means no audio at all.
#
#   tts_provider: riva | openai | elevenlabs | none
#   tts_voice:    a Magpie voice name | alloy/echo/fable/onyx/nova/shimmer | an
#                 ElevenLabs voice id
#   tts_api_key_env: name of the env var holding the speech key
#   tts_model / tts_base_url: openai + elevenlabs overrides
#
# No key for any of them? `speak: false` - the written changelog still works.
#
# speak: true
# tts_provider: riva
# tts_voice: Magpie-Multilingual.EN-US.Sofia
# tts_api_key_env: NVIDIA_API_KEY

# How much the spoken summary says: "brief" (2-3 sentences) or "detailed"
# (a fuller walkthrough). --detail on the CLI forces detailed for one run.
speech_detail: brief

# Riva plumbing. tts_function_id names an NVIDIA deployment, which can be
# retired the way a model id can - if speech starts failing with a Riva error,
# this is the value to check. Left as a built-in default so an updated voicelog
# can fix it for you; `voicelog --setup` deliberately does not pin it per user.
# tts_function_id: 877104f7-e885-42b9-8de8-f6e4c6303969  # magpie-tts-multilingual
# tts_language: en-US               # riva only
# tts_sample_rate: 44100            # riva only (openai/elevenlabs use their own rate)
tts_timeout: 90                   # seconds per speech request before giving up (avoids hangs)

# By default voicelog gives a transient rundown (print + speak). Set this true
# (or pass --changelog) to ALSO maintain a persistent release changelog.
write_changelog: false
# Where the persistent changelog goes, relative to the repo root.
voice_md: .changelog/voice.md
